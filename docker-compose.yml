---
name: staybook

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: staybook
      POSTGRES_USER: staybook
      POSTGRES_PASSWORD: staybook
    ports:
      - "5432:5432"

  wiremock:
    image: wiremock/wiremock:3.13.1
    ports:
      - "8089:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
