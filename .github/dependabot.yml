---
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    # include: scope would title test and plugin updates chore(deps-dev), and pr-title has no deps-dev scope.
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    # CodeQL refuses a run when init and analyze are on different versions.
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
