# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
---
reviews:
  profile: chill
  request_changes_workflow: false
  auto_title_placeholder: ""
  auto_review:
    drafts: false
  pre_merge_checks:
    title:
      mode: "off"
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
  path_instructions:
    - path: src/main/resources/db/migration/**
      instructions: |
        - Every foreign key has an index. booking to room_type must not use ON DELETE CASCADE.
        - inventory uses the key (room_type_id, date) and has CHECK (reserved >= 0 AND reserved <= total).
        - idempotency_key is unique on booking and on payment, and so is payment.provider_ref. payment has no user_id.
        - Amounts are bigint with _paise in the column name. Flag numeric, float or money.
        - status allows only HELD, CONFIRMED_UNPAID, PAID, CANCELLED, EXPIRED.
        - Never edit a migration that is already on main.
          Changes go in a new V<n>__ file, because Flyway checksums applied migrations.
    - path: src/main/java/com/staybook/booking/**
      instructions: &booking-rules |
        - A hold reserves rooms with a conditional UPDATE ... WHERE reserved < total.
          It succeeds only if the number of rows updated equals the number of nights.
          Flag any read-then-check-then-write.
        - A release changes the status first, guarded by WHERE status = 'HELD',
          and gives the rooms back only if exactly one row changed.
        - Reusing an idempotency key with a different request hash returns 422.
        - The payment gateway is never called inside a transaction. Business times come from the injected Clock.
    - path: src/main/java/com/staybook/inventory/**
      instructions: *booking-rules
    - path: src/main/java/com/staybook/payment/**
      instructions: *booking-rules
